[project]
name = "medivocate"
version = "0.1.0"
description = "An AI-driven platform empowering users with trustworthy, personalized history guidance to combat misinformation and promote equitable history."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.1.1",
    "einops>=0.8.1",
    "gdown>=5.2.0",
    "gradio>=5.49.0",
    "groq>=0.32.0",
    "langchain>=0.3.27",
    "langchain-chroma>=0.2.6",
    "langchain-community>=0.3.30",
    "langchain-groq>=0.3.8",
    "langchain-huggingface>=0.3.1",
    "langchain-ollama>=0.3.10",
    "loguru>=0.7.3",
    "pytest>=8.4.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.1.1",
    "tiktoken>=0.12.0",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.0",
]
